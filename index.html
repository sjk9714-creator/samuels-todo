<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Samuel's To-Do List</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#F7F5F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="To-Do">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/icon-192.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- deferred: runs after parsing but before DOMContentLoaded, so it no longer blocks first paint -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #F7F5F0; --surface: #FFFFFF; --text: #1A1A18; --text-muted: #8A8880;
      --text-faint: #C4C2BC; --border: rgba(0,0,0,0.08); --border-strong: rgba(0,0,0,0.14);
      --accent: #2D5A3D; --accent-light: #EBF2ED; --danger: #C0392B; --danger-light: #FDF0EE;
      --urgent-bg: #FDF0EE; --urgent-text: #C0392B; --important-bg: #FEF7E6; --important-text: #B7770D;
      --low-bg: #EBF2ED; --low-text: #2D5A3D; --radius: 14px; --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141412; --surface: #1E1E1B; --text: #F0EDE6; --text-muted: #7A7870;
        --text-faint: #4A4844; --border: rgba(255,255,255,0.07); --border-strong: rgba(255,255,255,0.12);
        --accent: #4A8C5C; --accent-light: #1A2E20; --danger: #E05C4B; --danger-light: #2E1612;
        --urgent-bg: #2E1612; --urgent-text: #E05C4B; --important-bg: #2A200A; --important-text: #D4920F;
        --low-bg: #162019; --low-text: #4A8C5C;
      }
    }
    html, body { height: 100%; }
    body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    #shell { display: flex; flex-direction: column; height: 100dvh; max-width: 520px; margin: 0 auto; }
    #install-bar { background: var(--text); color: var(--bg); text-align: center; font-size: 12px; padding: 8px 16px; display: none; flex-shrink: 0; }
    @media (display-mode: standalone) { #install-bar { display: none !important; } }
    #top { padding: 20px 20px 0; flex-shrink: 0; }
    #wordmark { font-family: 'DM Serif Display', serif; font-size: 22px; letter-spacing: -0.5px; color: var(--text); }
    #top-row { display: flex; align-items: baseline; justify-content: space-between; }
    #today-str { font-size: 12px; color: var(--text-muted); margin-top: 1px; font-weight: 300; }
    #sync-status { font-size: 11px; color: var(--text-faint); }
    #sync-status.ok { color: var(--accent); }
    #sync-status.warn { color: var(--important-text); }
    #sync-status.err { color: var(--danger); }
    #tabs { display: flex; gap: 0; margin-top: 16px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    #tabs::-webkit-scrollbar { display: none; }
    .tab { font-size: 13px; font-weight: 400; color: var(--text-muted); padding: 8px 14px; border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.15s; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
    .tab.active { color: var(--text); font-weight: 500; border-bottom-color: var(--text); }
    #panels { flex: 1; overflow: hidden; }
    .panel { display: none; height: 100%; flex-direction: column; overflow: hidden; }
    .panel.visible { display: flex; }

    /* Add area */
    #add-area { padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #add-row { display: flex; gap: 8px; }
    #task-input { flex: 1; height: 40px; padding: 0 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text); outline: none; transition: border-color 0.15s; }
    #task-input::placeholder { color: var(--text-faint); }
    #task-input:focus { border-color: var(--accent); }
    #mic-btn { height: 40px; width: 40px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: all 0.12s; flex-shrink: 0; }
    #mic-btn:hover { background: var(--bg); }
    #mic-btn.recording { background: var(--urgent-bg); color: var(--urgent-text); border-color: var(--urgent-text); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.55} }
    #add-btn { height: 40px; padding: 0 18px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 500; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); cursor: pointer; transition: opacity 0.15s; flex-shrink: 0; }
    #add-btn:hover { opacity: 0.85; }
    #add-btn:disabled { opacity: 0.4; cursor: default; }

    #task-options { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .opt-select { height: 30px; padding: 0 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text-muted); outline: none; cursor: pointer; }
    .opt-select:focus { border-color: var(--accent); }

    #filter-row { display: flex; gap: 6px; padding: 10px 20px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
    #filter-row::-webkit-scrollbar { display: none; }
    .filter-pill { font-size: 12px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--border-strong); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.12s; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
    .filter-pill.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    #task-list { flex: 1; overflow-y: auto; padding: 4px 20px 20px; }
    .task { display: flex; align-items: flex-start; gap: 10px; padding: 11px 0; border-bottom: 1px solid var(--border); }
    /* only genuinely new rows animate — previously every row re-ran this on every render */
    .task.is-new { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none} }
    .task:last-child { border-bottom: none; }
    .task.done { opacity: 0.45; }
    .check { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--border-strong); background: transparent; cursor: pointer; flex-shrink: 0; margin-top: 2px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
    .check.done { background: var(--accent); border-color: var(--accent); }
    .check.done::after { content:''; width:5px; height:3px; border-left:1.5px solid #fff; border-bottom:1.5px solid #fff; transform:rotate(-45deg) translateY(-1px); display:block; }
    .task-body { flex: 1; min-width: 0; }
    .task-text { font-size: 15px; color: var(--text); word-break: break-word; cursor: pointer; }
    .task.done .task-text { text-decoration: line-through; color: var(--text-faint); }
    .task-tags { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; align-items: center; }
    .tag { font-size: 11px; padding: 2px 8px; border-radius: 99px; }
    .tag.urgent { background: var(--urgent-bg); color: var(--urgent-text); }
    .tag.important { background: var(--important-bg); color: var(--important-text); }
    .tag.low { background: var(--low-bg); color: var(--low-text); }
    .tag.cat { background: var(--border); color: var(--text-muted); }
    .tag.overdue { background: var(--urgent-bg); color: var(--urgent-text); }
    .tag.duetoday { background: var(--important-bg); color: var(--important-text); }
    .tag.upcoming { background: var(--border); color: var(--text-muted); }
    .tag.recur { color: var(--text-faint); background: none; padding-left: 0; }
    .del { width: 26px; height: 26px; border: none; background: transparent; color: var(--text-faint); cursor: pointer; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; line-height: 1; transition: all 0.12s; }
    .del:hover { background: var(--danger-light); color: var(--danger); }
    #empty-state { text-align: center; padding: 3rem 0; color: var(--text-faint); font-size: 14px; }
    #task-footer { padding: 10px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
    #clear-done { font-size: 12px; font-family: 'DM Sans', sans-serif; color: var(--text-muted); background: none; border: none; cursor: pointer; text-decoration: underline; }
    #clear-done:hover { color: var(--danger); }

    /* History panel */
    #history-controls { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0; align-items: center; }
    #history-date { height: 34px; padding: 0 10px; font-family: 'DM Sans', sans-serif; font-size: 13px; background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--radius-sm); color: var(--text-muted); outline: none; flex: 1; }
    #history-search-btn { height: 34px; padding: 0 14px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; background: var(--text); color: var(--bg); border: none; border-radius: var(--radius-sm); cursor: pointer; white-space: nowrap; }
    #history-search-btn:hover { opacity: 0.85; }
    #history-list { flex: 1; overflow-y: auto; padding: 8px 20px 20px; }
    .history-day { margin-bottom: 20px; }
    .history-day-label { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
    .history-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text); }
    .history-item:last-child { border-bottom: none; }
    .history-check { width: 16px; height: 16px; border-radius: 50%; background: var(--accent); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .history-check::after { content:''; width:4px; height:2.5px; border-left:1.5px solid #fff; border-bottom:1.5px solid #fff; transform:rotate(-45deg) translateY(-0.5px); display:block; }
    .history-cat { font-size: 11px; padding: 2px 7px; border-radius: 99px; background: var(--border); color: var(--text-muted); margin-left: auto; flex-shrink: 0; }

    /* News panel */
    #news-filter-row { display: flex; gap: 6px; padding: 10px 20px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
    #news-filter-row::-webkit-scrollbar { display: none; }
    #news-list { flex: 1; overflow-y: auto; padding: 4px 20px 20px; }
    .news-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
    .news-item:last-child { border-bottom: none; }
    .news-headline { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.4; }
    .news-summary { font-size: 13px; color: var(--text-muted); margin-top: 4px; line-height: 1.5; }
    .news-meta { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
    .news-cat { font-size: 11px; padding: 2px 8px; border-radius: 99px; }
    .news-cat.cre { background: var(--accent-light); color: var(--accent); }
    .news-cat.capital-markets { background: var(--important-bg); color: var(--important-text); }
    .news-cat.re-tech { background: #E8EAF6; color: #3949AB; }
    @media (prefers-color-scheme: dark) { .news-cat.re-tech { background: #1A1A2E; color: #7986CB; } }
    .news-cat.nyc-la { background: var(--urgent-bg); color: var(--urgent-text); }
    .news-cat.general { background: var(--border); color: var(--text-muted); }
    .news-source { font-size: 11px; color: var(--text-faint); }
    .news-source a { color: var(--text-faint); text-decoration: underline; }
    .news-source a:hover { color: var(--text-muted); }
    .news-date-label { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 8px; margin-top: 16px; text-transform: uppercase; letter-spacing: 0.04em; }
    .news-date-label:first-child { margin-top: 8px; }
    #news-footer { padding: 10px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-faint); text-align: center; flex-shrink: 0; }
    #news-empty { text-align: center; padding: 3rem 0; color: var(--text-faint); font-size: 14px; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }

    /* Loading screen */
    #loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; gap: 20px; transition: opacity 0.4s ease; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-wordmark { font-family: 'DM Serif Display', serif; font-size: 26px; letter-spacing: -0.5px; color: var(--text); }
    #loading-msg { font-size: 13px; color: var(--text-muted); font-weight: 300; text-align: center; max-width: 220px; line-height: 1.6; }
    #loading-dots { display: flex; gap: 6px; align-items: center; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: dotPulse 1.4s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotPulse { 0%,80%,100%{opacity:0.2;transform:scale(0.8)}40%{opacity:1;transform:scale(1)} }
    #loading-slow { font-size: 12px; color: var(--text-faint); text-align: center; max-width: 240px; line-height: 1.6; display: none; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div id="loading-wordmark">Samuel's To-Do List</div>
    <div id="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div id="loading-msg">Waking things up...</div>
    <div id="loading-slow">Taking a little longer than usual — Supabase is warming up from sleep. Hang tight.</div>
  </div>

  <div id="shell">
    <div id="install-bar">Add to home screen — tap Share → Add to Home Screen</div>
    <div id="top">
      <div id="top-row">
        <div id="wordmark">Samuel's To-Do List</div>
        <span id="sync-status">connecting...</span>
      </div>
      <div id="today-str"></div>
      <div id="tabs">
        <button class="tab active" data-tab="tasks">Tasks</button>
        <button class="tab" data-tab="news">News</button>
        <button class="tab" data-tab="history">History</button>
      </div>
    </div>

    <div id="panels">
      <!-- Tasks -->
      <div class="panel visible" id="panel-tasks">
        <div id="add-area">
          <div id="add-row">
            <input type="text" id="task-input" placeholder="Add a task..." autocomplete="off" />
            <button id="mic-btn" title="Voice input">🎤</button>
            <button id="add-btn">Add</button>
          </div>
          <div id="task-options">
            <select class="opt-select" id="priority-select">
              <option value="">Priority</option>
              <option value="urgent">🔴 Urgent</option>
              <option value="important">🟡 Important</option>
              <option value="low">🟢 Low</option>
            </select>
            <input type="date" id="due-input" class="opt-select" />
            <select class="opt-select" id="recur-select">
              <option value="">Recurring</option>
              <option value="daily">↻ Daily</option>
              <option value="weekly">↻ Weekly</option>
            </select>
          </div>
        </div>
        <div id="filter-row">
          <button class="filter-pill active" data-filter="all">All</button>
          <button class="filter-pill" data-filter="active">Active</button>
          <button class="filter-pill" data-filter="done">Done</button>
          <button class="filter-pill" data-filter="urgent">Urgent</button>
          <button class="filter-pill" data-filter="today">Due Today</button>
          <button class="filter-pill" data-filter="overdue">Overdue</button>
        </div>
        <div id="task-list"></div>
        <div id="task-footer">
          <span id="count-label"></span>
          <button id="clear-done">Clear completed</button>
        </div>
      </div>

      <!-- News -->
      <div class="panel" id="panel-news">
        <div id="news-filter-row">
          <button class="filter-pill active" data-news-filter="all">All</button>
          <button class="filter-pill" data-news-filter="CRE">CRE</button>
          <button class="filter-pill" data-news-filter="Markets">Markets</button>
          <button class="filter-pill" data-news-filter="RE Tech">RE Tech</button>
          <button class="filter-pill" data-news-filter="NYC/LA">NYC/LA</button>
          <button class="filter-pill" data-news-filter="General">General</button>
        </div>
        <div id="news-list"><div id="news-empty">No news yet — gets populated daily.</div></div>
        <div id="news-footer">Updated daily</div>
      </div>

      <!-- History -->
      <div class="panel" id="panel-history">
        <div id="history-controls">
          <input type="month" id="history-date" class="opt-select" style="flex:1;" />
          <button id="history-search-btn">Load</button>
        </div>
        <div id="history-list"><div id="empty-state">Select a month and hit Load</div></div>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const SUPABASE_URL = 'https://rtgtgjcfaabdvumqtwgl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ0Z3RnamNmYWFiZHZ1bXF0d2dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNDY1NjAsImV4cCI6MjA4ODkyMjU2MH0.IcdGUydtjwS1aYzZGv32GesRcOe3YafgQ0P_CeJyS2A';
    const CACHE_KEY = 'todo.tasks.v1';
    const $ = id => document.getElementById(id);
    // If the CDN client is unreachable (first offline open), fall through to a
    // read-only view of the cached list instead of throwing on boot.
    const sb = (typeof supabase !== 'undefined' && supabase.createClient)
      ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    let tasks = [];
    let filter = 'all';
    let newsFilter = 'all';
    let newsItems = [];
    let newsLoaded = false;
    let historyData = [];
    let isRecording = false;
    let recognition = null;
    let rolloverDay = null;        // local date the last rollover ran for
    let refreshing = false;
    let renderedIds = new Set();   // drives the enter animation
    let channel = null;
    let retryCount = 0;

    // ── Helpers ───────────────────────────────────────────
    // Local calendar date. The old version used toISOString(), which is UTC —
    // after ~8pm Eastern that returned tomorrow, so a task completed in the
    // evening was stamped with the wrong day and never came back.
    function dateStr(d) {
      return d.getFullYear() + '-' +
             String(d.getMonth() + 1).padStart(2, '0') + '-' +
             String(d.getDate()).padStart(2, '0');
    }
    function today() { return dateStr(new Date()); }

    function setSync(state, label) {
      const el = $('sync-status');
      el.textContent = label;
      el.className = state;
    }
    function escHtml(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    // only http(s) may reach an href; blocks javascript: and data: URLs
    function safeUrl(u) {
      try {
        const p = new URL(u);
        return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : null;
      } catch { return null; }
    }
    function prettyDate(ymd) {
      const d = new Date(ymd + 'T12:00:00');
      return isNaN(d) ? ymd : d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
    }

    // ── Local cache: paints instantly, survives a cold/offline start ───
    function readCache() {
      try {
        const raw = JSON.parse(localStorage.getItem(CACHE_KEY));
        return Array.isArray(raw?.tasks) ? raw.tasks : null;
      } catch { return null; }
    }
    function writeCache() {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ tasks, savedAt: Date.now() })); } catch {}
    }

    // ── Loading screen ────────────────────────────────────
    function showLoading(msg) {
      const s = $('loading-screen');
      $('loading-msg').textContent = msg;
      s.style.display = 'flex';
      s.classList.remove('hidden');
      delete s.dataset.hidden;
    }
    function hideLoading() {
      const s = $('loading-screen');
      if (s.dataset.hidden === '1') return;
      s.dataset.hidden = '1';
      s.classList.add('hidden');
      setTimeout(() => { s.style.display = 'none'; }, 400);
    }

    // ── Sync ──────────────────────────────────────────────
    // One RPC does the day-boundary rollover (reset recurring, archive stale)
    // and returns the resulting list, so this is a single round trip.
    async function refresh({ initial = false } = {}) {
      if (!sb) { setSync('err', tasks.length ? 'offline · cached' : 'offline'); hideLoading(); return; }
      if (refreshing) return;
      refreshing = true;
      let slowTimer = null;
      if (initial && !tasks.length) {
        slowTimer = setTimeout(() => {
          $('loading-slow').style.display = 'block';
          showLoading('Still loading...');
        }, 4000);
      }
      try {
        const { data, error } = await sb.rpc('daily_rollover', { p_today: today() });
        if (error) throw error;
        tasks = data || [];
        rolloverDay = today();
        renderTasks();
        writeCache();
        setSync('ok', '● live');
      } catch (err) {
        console.error('refresh failed:', err);
        setSync('err', tasks.length ? 'offline · cached' : 'offline');
      } finally {
        if (slowTimer) clearTimeout(slowTimer);
        refreshing = false;
        hideLoading();
      }
    }

    function subscribe() {
      if (!sb) return;
      if (channel) { sb.removeChannel(channel); channel = null; }
      channel = sb.channel('tasks-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, payload => {
          const { eventType, new: n, old: o } = payload;
          if (eventType === 'INSERT') {
            if (!tasks.some(t => t.id === n.id)) tasks.unshift(n);
          } else if (eventType === 'UPDATE') {
            const i = tasks.findIndex(t => t.id === n.id);
            if (i !== -1) tasks[i] = n;
          } else if (eventType === 'DELETE') {
            tasks = tasks.filter(t => t.id !== o.id);
          }
          renderTasks();
          writeCache();
        })
        .subscribe(status => {
          if (status === 'SUBSCRIBED') {
            retryCount = 0;
            setSync('ok', '● live');
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            // the old version claimed "● live" forever after the socket died
            setSync('warn', 'reconnecting...');
            const delay = Math.min(30000, 1000 * Math.pow(2, retryCount++));
            setTimeout(subscribe, delay);
          }
        });
    }

    // Resume, reconnect and midnight all funnel through refresh(). The old
    // build relied solely on a setTimeout scheduled for midnight, which never
    // fires on a phone because the page is frozen the moment it backgrounds.
    function startWatchers() {
      subscribe();
      document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
      window.addEventListener('online', () => refresh());
      setInterval(() => { if (today() !== rolloverDay) refresh(); }, 60000);
    }

    // ── CRUD ──────────────────────────────────────────────
    async function addTask(rawText) {
      const text = (rawText || '').trim();
      if (!text) return;
      if (!sb) { setSync('err', 'offline — cannot add'); return; }
      const btn = $('add-btn');
      btn.disabled = true;
      // id and created are assigned server-side now, not from the client clock
      const row = {
        text,
        done: false,
        priority: $('priority-select').value || null,
        due: $('due-input').value || null,
        recurring: $('recur-select').value || null,
        last_reset: null,
        completed_date: null,
        category: guessCategory(text)
      };
      try {
        const { data, error } = await sb.from('tasks').insert(row).select().single();
        if (error) throw error;
        // add locally too, so the task appears even if realtime is asleep
        if (data && !tasks.some(t => t.id === data.id)) {
          tasks.unshift(data);
          renderTasks();
          writeCache();
        }
        $('priority-select').value = '';
        $('due-input').value = '';
        $('recur-select').value = '';
        $('task-input').value = '';
      } catch (err) {
        console.error('add failed:', err);
        setSync('err', 'add failed');
        $('task-input').value = text;   // don't silently eat what he typed
      } finally {
        btn.disabled = false;
      }
    }

    async function toggleTask(id) {
      if (!sb) { setSync('err', 'offline — read only'); return; }
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      const nowDone = !t.done;
      const changes = { done: nowDone, completed_date: nowDone ? today() : null };
      if (nowDone && t.recurring) changes.last_reset = today();
      const before = { done: t.done, completed_date: t.completed_date, last_reset: t.last_reset };
      Object.assign(t, changes);
      renderTasks();
      writeCache();
      const { error } = await sb.from('tasks').update(changes).eq('id', id);
      if (error) {                       // roll the optimistic update back
        Object.assign(t, before);
        renderTasks();
        writeCache();
        setSync('err', 'sync error');
      }
    }

    async function deleteTask(id) {
      if (!sb) { setSync('err', 'offline — read only'); return; }
      const idx = tasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      const removed = tasks[idx];
      tasks.splice(idx, 1);
      renderTasks();
      writeCache();
      const { error } = await sb.from('tasks').delete().eq('id', id);
      if (error) {
        tasks.splice(idx, 0, removed);
        renderTasks();
        writeCache();
        setSync('err', 'sync error');
      }
    }

    // Archives completed one-off tasks and *resets* recurring ones. The old
    // loop deleted recurring tasks outright, so clearing completed while a
    // daily was checked off destroyed it permanently.
    async function clearDone() {
      if (!sb) { setSync('err', 'offline — read only'); return; }
      const { error } = await sb.rpc('clear_done_tasks', { p_today: today() });
      if (error) { console.error('clear failed:', error); setSync('err', 'sync error'); return; }
      await refresh();
    }

    function guessCategory(text) {
      if (/study|exam|class|lecture|assignment|homework|nyu|course|textbook|quiz/i.test(text)) return 'academic';
      if (/apply|resume|interview|internship|linkedin|cover letter|career|job/i.test(text)) return 'career';
      if (/gym|workout|run|lift|train|exercise|cardio|physique|bodybuilding/i.test(text)) return 'fitness';
      if (/read|book|article|chapter|podcast|pages/i.test(text)) return 'reading';
      if (/pay|bill|rent|bank|budget|finance|money|invoice/i.test(text)) return 'finance';
      return 'personal';
    }

    function formatDueTag(due) {
      const t = today();
      const label = new Date(due + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric' });
      if (due < t) return `<span class="tag overdue">Overdue · ${label}</span>`;
      if (due === t) return `<span class="tag duetoday">Due today</span>`;
      return `<span class="tag upcoming">${label}</span>`;
    }

    // ── Render tasks ──────────────────────────────────────
    function getVisible() {
      const t = today();
      return tasks.filter(task => {
        if (filter === 'active') return !task.done;
        if (filter === 'done') return task.done;
        if (filter === 'urgent') return task.priority === 'urgent' && !task.done;
        if (filter === 'today') return task.due === t && !task.done;
        if (filter === 'overdue') return task.due && task.due < t && !task.done;
        return true;
      });
    }

    function renderTasks() {
      const visible = getVisible();
      const list = $('task-list');
      const pl = { urgent:'🔴 Urgent', important:'🟡 Important', low:'🟢 Low' };
      const seen = new Set();

      if (!visible.length) {
        const msgs = { all:'Nothing here yet', active:'All done! 🎉', done:'No completed tasks',
                       urgent:'No urgent tasks', today:'Nothing due today', overdue:'No overdue tasks' };
        list.innerHTML = `<div id="empty-state">${msgs[filter] || 'Nothing here'}</div>`;
      } else {
        list.innerHTML = visible.map(t => {
          seen.add(t.id);
          const isNew = renderedIds.size && !renderedIds.has(t.id);
          const tags = [
            t.priority ? `<span class="tag ${escHtml(t.priority)}">${pl[t.priority] || escHtml(t.priority)}</span>` : '',
            t.due ? formatDueTag(t.due) : '',
            t.category ? `<span class="tag cat">${escHtml(t.category)}</span>` : '',
            t.recurring ? `<span class="tag recur">↻ ${escHtml(t.recurring)}</span>` : ''
          ].filter(Boolean).join('');
          return `<div class="task${t.done ? ' done' : ''}${isNew ? ' is-new' : ''}" data-id="${t.id}">
            <button class="check${t.done ? ' done' : ''}" data-action="toggle" aria-label="Toggle"></button>
            <div class="task-body">
              <div class="task-text" data-action="toggle">${escHtml(t.text)}</div>
              ${tags ? `<div class="task-tags">${tags}</div>` : ''}
            </div>
            <button class="del" data-action="delete" aria-label="Delete">×</button>
          </div>`;
        }).join('');
      }
      renderedIds = seen;

      const t = today();
      let active = 0, overdue = 0;
      for (const task of tasks) {
        if (task.done) continue;
        active++;
        if (task.due && task.due < t) overdue++;
      }
      $('count-label').textContent = `${active} remaining${overdue ? ' · ' + overdue + ' overdue' : ''}`;
    }

    // ── News (loaded lazily on first visit to the tab) ─────
    async function loadNews() {
      if (!sb) { $('news-list').innerHTML = '<div id="news-empty">Offline — news unavailable.</div>'; return; }
      const { data, error } = await sb.from('daily_news')
        .select('*')
        .order('date_added', { ascending: false })
        .order('id', { ascending: false })
        .limit(50);
      if (error) { console.error('news load error:', error); return; }
      newsItems = data || [];
      newsLoaded = true;
      renderNews();
    }

    // The news writer emits "Markets"; earlier rows used "Capital Markets".
    // Fold them together so the filter pill matches either spelling.
    const CAT_ALIASES = { 'Capital Markets': 'Markets' };
    function normCat(c) { return CAT_ALIASES[c] || c || 'General'; }

    function renderNews() {
      const list = $('news-list');
      const filtered = newsFilter === 'all'
        ? newsItems
        : newsItems.filter(n => normCat(n.category) === newsFilter);

      if (!filtered.length) {
        list.innerHTML = `<div id="news-empty">${newsItems.length ? 'No news in this category.' : 'No news yet — gets populated daily.'}</div>`;
        $('news-footer').textContent = newsItems.length ? `${newsItems.length} articles loaded` : 'Updated daily';
        return;
      }

      const catClass = cat => ({
        'CRE': 'cre', 'Markets': 'capital-markets',
        'RE Tech': 're-tech', 'NYC/LA': 'nyc-la'
      }[normCat(cat)] || 'general');

      const grouped = {};
      for (const item of filtered) {
        (grouped[item.date_added] ||= []).push(item);
      }

      list.innerHTML = Object.keys(grouped).sort((a, b) => String(b).localeCompare(String(a))).map(date => {
        const items = grouped[date].map(item => {
          const href = item.source_url ? safeUrl(item.source_url) : null;
          let host = '';
          if (href) { try { host = new URL(href).hostname.replace(/^www\./, ''); } catch {} }
          return `<div class="news-item">
            <div class="news-headline">${escHtml(item.headline)}</div>
            <div class="news-summary">${escHtml(item.summary)}</div>
            <div class="news-meta">
              <span class="news-cat ${catClass(item.category)}">${escHtml(item.category)}</span>
              ${href ? `<span class="news-source"><a href="${escHtml(href)}" target="_blank" rel="noopener noreferrer">${escHtml(host)}</a></span>` : ''}
            </div>
          </div>`;
        }).join('');
        return `<div class="news-date-label">${escHtml(prettyDate(date))}</div>${items}`;
      }).join('');

      $('news-footer').textContent = `${filtered.length} article${filtered.length !== 1 ? 's' : ''}`;
    }

    // ── History ───────────────────────────────────────────
    async function loadHistory() {
      if (!sb) { $('history-list').innerHTML = '<div id="empty-state">Offline — history unavailable.</div>'; return; }
      const monthVal = $('history-date').value;
      if (!monthVal) return;
      const [year, month] = monthVal.split('-').map(Number);
      const start = `${year}-${String(month).padStart(2, '0')}-01`;
      // half-open range: the old code used a hardcoded day 31, which is not a
      // real date in half the months and now that completed_date is a real
      // date column would be rejected outright
      const nextYear = month === 12 ? year + 1 : year;
      const nextMonth = month === 12 ? 1 : month + 1;
      const endExclusive = `${nextYear}-${String(nextMonth).padStart(2, '0')}-01`;

      const { data, error } = await sb.from('task_history')
        .select('*')
        .gte('completed_date', start)
        .lt('completed_date', endExclusive)
        .order('completed_date', { ascending: false });
      if (error) {
        console.error('history load error:', error);
        $('history-list').innerHTML = '<div id="empty-state">Error loading history</div>';
        return;
      }
      historyData = data || [];
      renderHistory();
    }

    function renderHistory() {
      const list = $('history-list');
      if (!historyData.length) {
        list.innerHTML = '<div id="empty-state">No completed tasks this month</div>';
        return;
      }
      const grouped = {};
      for (const item of historyData) {
        (grouped[item.completed_date] ||= []).push(item);
      }
      list.innerHTML = Object.keys(grouped).sort((a, b) => String(b).localeCompare(String(a))).map(date => {
        const items = grouped[date].map(item =>
          `<div class="history-item"><div class="history-check"></div><span>${escHtml(item.text)}</span>${
            item.category ? `<span class="history-cat">${escHtml(item.category)}</span>` : ''
          }</div>`).join('');
        return `<div class="history-day"><div class="history-day-label">${escHtml(prettyDate(date))}</div>${items}</div>`;
      }).join('');
    }

    // ── Wiring ────────────────────────────────────────────
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
        btn.classList.add('active');
        $('panel-' + btn.dataset.tab).classList.add('visible');
        // news no longer competes with the task load on every cold start
        if (btn.dataset.tab === 'news' && !newsLoaded) loadNews();
      });
    });

    $('filter-row').addEventListener('click', e => {
      const f = e.target.dataset.filter;
      if (!f) return;
      filter = f;
      document.querySelectorAll('#filter-row .filter-pill').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      renderTasks();
    });

    $('news-filter-row').addEventListener('click', e => {
      const f = e.target.dataset.newsFilter;
      if (!f) return;
      newsFilter = f;
      document.querySelectorAll('#news-filter-row .filter-pill').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      renderNews();
    });

    $('add-btn').addEventListener('click', () => addTask($('task-input').value));
    $('task-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask(e.target.value);
    });
    $('task-list').addEventListener('click', e => {
      const item = e.target.closest('.task');
      if (!item) return;
      const id = Number(item.dataset.id);
      const action = e.target.dataset.action || e.target.closest('[data-action]')?.dataset.action;
      if (action === 'toggle') toggleTask(id);
      if (action === 'delete') deleteTask(id);
    });
    $('clear-done').addEventListener('click', clearDone);
    $('history-search-btn').addEventListener('click', loadHistory);

    // ── Voice ─────────────────────────────────────────────
    $('mic-btn').addEventListener('click', () => {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) { alert('Voice input not supported here. Try Chrome or Safari.'); return; }
      if (isRecording) { recognition && recognition.stop(); return; }
      recognition = new SR();
      recognition.lang = 'en-US';
      recognition.interimResults = false;
      const btn = $('mic-btn');
      recognition.onstart  = () => { isRecording = true;  btn.classList.add('recording'); };
      recognition.onresult = e => { $('task-input').value = e.results[0][0].transcript; };
      recognition.onend    = () => { isRecording = false; btn.classList.remove('recording'); };
      recognition.onerror  = () => { isRecording = false; btn.classList.remove('recording'); };
      recognition.start();
    });

    // ── Boot ──────────────────────────────────────────────
    function setToday() {
      $('today-str').textContent = new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
      $('history-date').value = today().slice(0, 7);
    }

    const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (!standalone && /iPhone|iPad/.test(navigator.userAgent)) {
      $('install-bar').style.display = 'block';
    }

    setToday();

    // Paint cached tasks immediately; the network round trip then reconciles.
    const cached = readCache();
    if (cached && cached.length) {
      tasks = cached;
      renderTasks();
      hideLoading();
      setSync('warn', 'cached...');
    } else {
      showLoading('Waking things up...');
    }

    refresh({ initial: true }).then(startWatchers);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW failed:', err));
      });
    }
  });
  </script>
</body>
</html>
